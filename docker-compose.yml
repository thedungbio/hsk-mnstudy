version: '3.8'

services:
  hskmaster-app:
    build: .
    container_name: hskmaster-ai-production
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=hsk_production_secret_key_change_me_in_prod
    volumes:
      - ./server/database:/app/server/database
      - ./server/uploads:/app/server/uploads
