services:
  - type: web
    name: hsk-mnstudy
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm --prefix server install --omit=dev
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
